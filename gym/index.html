<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#142130"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Iron Log">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style></head><body>
<title>دفتر الحديد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Lalezar&display=swap">
<style>
/* Layout: single-column mobile log, sticky header, bottom tab bar, rest timer docked above it */
:root{
  --bg:#eceff3; --surface:#ffffff; --surface-2:#f4f6f9; --line:#d5dbe3;
  --fg:#142130; --muted:#5b6878; --accent:#1d4fc4; --accent-ink:#ffffff; --accent-soft:#e1e9fb;
  --pr:#b98200; --pr-soft:#fbefd0; --good:#1f7a4d; --good-soft:#dcf1e5; --warn:#b4471f; --warn-soft:#fbe3d9;
  --f-display:"Lalezar","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e141b; --surface:#17202a; --surface-2:#1e2935; --line:#2c3a49;
  --fg:#e6ebf1; --muted:#97a4b4; --accent:#7ea3ff; --accent-ink:#0b1320; --accent-soft:#1c2a47;
  --pr:#f0c04a; --pr-soft:#3a2f12; --good:#5fcf95; --good-soft:#163527; --warn:#ff9a72; --warn-soft:#3d2219;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141b; --surface:#17202a; --surface-2:#1e2935; --line:#2c3a49;
  --fg:#e6ebf1; --muted:#97a4b4; --accent:#7ea3ff; --accent-ink:#0b1320; --accent-soft:#1c2a47;
  --pr:#f0c04a; --pr-soft:#3a2f12; --good:#5fcf95; --good-soft:#163527; --warn:#ff9a72; --warn-soft:#3d2219;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;margin:0}
.app{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 170px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--f-display);font-size:28px;line-height:1;letter-spacing:.5px;min-width:0}
.brand small{display:block;font-family:var(--f-body);font-size:12px;color:var(--muted);letter-spacing:0;margin-top:4px}
.plates{display:flex;gap:3px;align-items:center}
.plates i{display:block;width:7px;border-radius:2px}
h2{font-family:var(--f-display);font-weight:400;font-size:24px;margin:22px 0 8px;text-wrap:balance}
h3{font-size:16px;margin:0;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:380px){.grid3{grid-template-columns:1fr 1fr}}
.stat b{display:block;font-size:22px}
.stat span.l{font-size:12px;color:var(--muted)}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;min-height:40px}
button:disabled{opacity:.4;cursor:default}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
button.ghost{background:transparent;border-color:transparent;color:var(--muted)}
button.danger{color:var(--warn);border-color:var(--warn)}
button.block{width:100%}
button.link{background:none;border:0;padding:4px 6px;min-height:32px;color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:40px;width:100%;min-width:0}
textarea{min-height:110px;font-family:var(--f-num);font-size:12px;direction:ltr}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:0 0 auto;border-radius:999px;padding:6px 14px;min-height:36px;font-size:14px}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-inline-start:6px;vertical-align:middle}
.tag{display:inline-block;font-size:12px;border-radius:6px;padding:1px 8px;background:var(--surface-2);color:var(--muted)}
.tag.pr{background:var(--pr-soft);color:var(--pr);font-weight:700}
.tag.up{background:var(--good-soft);color:var(--good);font-weight:600}
.tag.acc{background:var(--accent-soft);color:var(--accent);font-weight:600}
.ex-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ex-head .sub{font-size:12px;color:var(--muted)}
.target{font-size:13px;color:var(--muted);white-space:nowrap;text-align:end}
.hint{font-size:13px;margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--surface-2)}
.hint.up{background:var(--good-soft);color:var(--good)}
.info{margin-top:10px;padding:10px 12px;border-radius:8px;background:var(--accent-soft);font-size:13px}
.info ol,.info ul{margin:4px 0 6px;padding-inline-start:20px}
.info b{display:block;margin-top:4px}
.sets{display:grid;grid-template-columns:28px 1fr 1fr 44px;gap:6px 8px;align-items:center;margin-top:10px}
.sets.rpe{grid-template-columns:28px 1fr 1fr 62px 44px}
.sets .h{font-size:12px;color:var(--muted)}
.sets input,.sets select{text-align:center;font-family:var(--f-num);direction:ltr;padding-inline:4px}
.sets .idx{font-family:var(--f-num);color:var(--muted);text-align:center}
.sets .idx.wu{color:var(--pr);font-weight:700;font-family:var(--f-body);font-size:12px}
.sets .wuin{background:var(--pr-soft);border-color:transparent}
.tick{width:44px;height:40px;padding:0;border-radius:8px;font-size:18px;line-height:1}
.tick.done{background:var(--good);border-color:var(--good);color:var(--surface)}
.set-done{border-color:var(--good)!important}
details.card summary{cursor:pointer;font-weight:700}
details.card[open] summary{margin-bottom:8px}
ul.clean{list-style:none;margin:0;padding:0}
ul.list li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
ul.list li:last-child{border-bottom:0}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.over i{background:var(--good)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 6px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600}
.chart svg{width:100%;height:auto;display:block}
.empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r);font-size:14px}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13px;margin-top:12px}
.prog.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.q{display:flex;flex-direction:column;gap:8px}
.q>span{font-weight:700}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{border:0;border-radius:0;background:transparent;padding:8px 2px 10px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;min-height:56px}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--accent);font-weight:700}
.timer{position:fixed;left:0;right:0;bottom:calc(57px + env(safe-area-inset-bottom,0px));z-index:9;padding-inline:16px}
.timer .in{max-width:640px;margin:0 auto 8px;background:var(--fg);color:var(--bg);border-radius:14px;padding:10px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 6px 24px rgb(0 0 0 / .25)}
.timer .clock{font-family:var(--f-num);font-size:28px;font-weight:600;direction:ltr;min-width:84px}
.timer .lbl{flex:1;font-size:13px;min-width:0}
.timer button{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 40%,transparent);min-height:36px;padding:4px 10px}
.timer.ding .in{background:var(--good);color:var(--surface)}
.toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 70px);left:50%;transform:translateX(-50%);z-index:20;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px)}
.confirm-on{background:var(--warn)!important;color:var(--surface)!important;border-color:var(--warn)!important}
@media (prefers-reduced-motion:no-preference){.tick,.chip,button{transition:background .15s,color .15s}}
</style>

<div class="app" id="app" dir="rtl" lang="ar">
  <header class="top">
    <div class="brand"><span id="brandName">دفتر الحديد</span><small id="subtitle"></small></div>
    <div class="plates" aria-hidden="true">
      <i style="height:34px;background:#c8312b"></i><i style="height:30px;background:#2453c9"></i><i style="height:26px;background:#e2b014"></i><i style="height:22px;background:#2b8a4b"></i>
    </div>
  </header>
  <div id="storeWarn" class="banner" hidden></div>
  <main id="view"></main>
</div>

<div class="timer" id="timer" hidden>
  <div class="in">
    <div class="clock" id="tClock">2:00</div>
    <div class="lbl" id="tLabel"></div>
    <button type="button" id="tPlus">+30</button>
    <button type="button" id="tStop"></button>
  </div>
</div>

<nav class="tabs" id="tabs"></nav>
<div class="toast" id="toast" hidden></div>
<script>
(function(){"use strict";
/* ---------- exercise library ----------
   id, group, k (u = upper-body increment, l = leg increment), c (compound: gets a warm-up plan),
   default lo/hi/rest, name [ar,en], muscles [ar,en], steps [ar,en] ("|" separated), mistakes [ar,en] */
const LIB={};
function X(id,g,k,c,lo,hi,rest,name,mu,st,mi){LIB[id]={id,g,k,c:!!c,lo,hi,rest,name:{ar:name[0],en:name[1]},mu:{ar:mu[0],en:mu[1]},st:{ar:st[0],en:st[1]},mi:{ar:mi[0],en:mi[1]}}}
const BW=new Set(["pushup","pullup","dips","hlr"]); // bodyweight: log added weight only
// Chest
X("bench","ch","u",1,6,10,150,["ضغط صدر بالبار","Barbell Bench Press"],["الصدر، الكتف الأمامي، التراي","Chest, front delts, triceps"],
 ["استلقِ وعيناك تحت البار والقدمان ثابتتان على الأرض|اقبض البار أعرض قليلًا من الكتفين وشدّ لوحي الكتف للخلف وللأسفل|أنزل البار بتحكم إلى أسفل الصدر ثم ادفعه لأعلى","Lie with your eyes under the bar, feet planted|Grip slightly wider than your shoulders; pull shoulder blades back and down|Lower under control to the lower chest, then press up"],
 ["ارتداد البار عن الصدر|فتح المرفقين ٩٠ درجة عن الجسم|رفع المؤخرة عن المقعد","Bouncing the bar off the chest|Flaring the elbows out to 90°|Lifting the hips off the bench"]);
X("dbbench","ch","u",1,8,12,120,["ضغط صدر بالدمبل","Dumbbell Bench Press"],["الصدر، الكتف الأمامي، التراي","Chest, front delts, triceps"],
 ["اجلس والدمبلات على فخذيك ثم استلقِ وارفعها فوق الصدر|أنزلها ببطء إلى مستوى الصدر والمرفقان بزاوية ٤٥° تقريبًا|ادفعها لأعلى مع تقريبها قليلًا من بعض","Sit with the dumbbells on your thighs, lie back and press them over your chest|Lower slowly to chest level, elbows at about 45°|Press up, bringing them slightly together"],
 ["إنزال الدمبلات بسرعة|ضرب الدمبلات ببعض في الأعلى","Dropping the weights too fast|Clanking the dumbbells together at the top"]);
X("incbb","ch","u",1,6,10,150,["ضغط صدر مائل بالبار","Incline Barbell Press"],["الصدر العلوي، الكتف الأمامي، التراي","Upper chest, front delts, triceps"],
 ["اضبط المقعد على ميل ٣٠–٤٥°|أنزل البار إلى أعلى الصدر تحت الترقوة|ادفع لأعلى مع إبقاء لوحي الكتف مشدودين","Set the bench to 30–45°|Lower the bar to the upper chest, just below the collarbone|Press up, keeping your shoulder blades tight"],
 ["ميل المقعد عالٍ جدًا فيتحول التمرين للأكتاف|رفع الصدر والمؤخرة عن المقعد","Bench too steep, turning it into a shoulder press|Lifting the chest and hips off the bench"]);
X("incdb","ch","u",1,8,12,120,["ضغط صدر مائل بالدمبل","Incline Dumbbell Press"],["الصدر العلوي، الكتف الأمامي، التراي","Upper chest, front delts, triceps"],
 ["مقعد بميل ٣٠–٤٥°|أنزل الدمبلات بجانب أعلى الصدر|ادفع لأعلى دون قفل المرفقين بعنف","Bench at 30–45°|Lower the dumbbells beside the upper chest|Press up without slamming the elbows into lockout"],
 ["مدى حركة قصير|تقوّس مبالغ في أسفل الظهر","Cutting the range of motion short|Over-arching the lower back"]);
X("machpress","ch","u",0,8,12,90,["جهاز ضغط صدر","Machine Chest Press"],["الصدر، التراي","Chest, triceps"],
 ["اضبط المقعد بحيث تكون المقابض بمستوى منتصف الصدر|ادفع حتى يستقيم الذراعان تقريبًا|ارجع ببطء حتى تشعر بتمدد الصدر","Adjust the seat so the handles are at mid-chest|Press until your arms are nearly straight|Return slowly until you feel a chest stretch"],
 ["رفع الكتفين نحو الأذنين|ترك الأوزان ترتطم","Shrugging the shoulders up|Letting the weight stack slam"]);
X("cablefly","ch","u",0,10,15,75,["تفتيح صدر بالكيبل","Cable Fly"],["الصدر","Chest"],
 ["قف بين البكرتين مع خطوة للأمام|حافظ على ثنية خفيفة ثابتة في المرفقين|اجمع اليدين أمام الصدر كأنك تحضن شجرة ثم ارجع ببطء","Stand between the pulleys with one foot forward|Keep a slight, fixed bend in the elbows|Bring your hands together in front of your chest like hugging a tree, then return slowly"],
 ["ثني المرفقين وتحويل الحركة إلى ضغط|وزن ثقيل يشد الكتفين للخلف بقوة","Bending the elbows and turning it into a press|So much weight it yanks the shoulders back"]);
X("pecdeck","ch","u",0,10,15,75,["جهاز فراشة (Pec Deck)","Pec Deck"],["الصدر","Chest"],
 ["اضبط المقعد لتكون المقابض بمستوى الصدر|اجمع الذراعين أمامك واعصر الصدر ثانية|ارجع ببطء دون أن يسحبك الوزن","Set the seat so the handles are at chest height|Bring your arms together and squeeze for a second|Return slowly without letting the weight pull you back"],
 ["استخدام اندفاع الجسم|مدى حركة قصير","Using momentum|Short range of motion"]);
X("dips","ch","u",1,6,12,120,["متوازي (Dips)","Dips"],["الصدر السفلي، التراي، الكتف الأمامي","Lower chest, triceps, front delts"],
 ["ابدأ والذراعان مستقيمان|مِل قليلًا للأمام وانزل حتى يصبح الكتف بمستوى المرفق تقريبًا|ادفع لأعلى. سجّل الوزن الإضافي فقط (0 إن لم يوجد)","Start with your arms locked out|Lean slightly forward and lower until your shoulders are about level with your elbows|Press back up. Log added weight only (0 if none)"],
 ["النزول أعمق مما يتحمله الكتف|التأرجح","Going deeper than your shoulders tolerate|Swinging"]);
X("pushup","ch","u",1,8,20,75,["ضغط (Push-up)","Push-up"],["الصدر، التراي، الكتف الأمامي","Chest, triceps, front delts"],
 ["اليدان أعرض قليلًا من الكتفين والجسم مستقيم من الرأس للكعب|انزل حتى يقترب الصدر من الأرض|ادفع لأعلى. سجّل 0 كوزن إن لم تضف وزنًا","Hands slightly wider than your shoulders, body straight from head to heels|Lower until your chest nearly touches the floor|Push up. Log 0 kg unless you add weight"],
 ["هبوط الحوض|أنصاف التكرارات","Sagging hips|Half reps"]);
X("dbfloor","ch","u",1,8,12,90,["ضغط صدر بالدمبل على الأرض","Dumbbell Floor Press"],["الصدر، التراي","Chest, triceps"],
 ["استلقِ على الأرض والركبتان مثنيتان|أنزل الدمبلات حتى يلمس أعلى الذراع الأرض بهدوء|ادفع لأعلى","Lie on the floor with your knees bent|Lower until your upper arms gently touch the floor|Press up"],
 ["ارتطام المرفقين بالأرض|فتح المرفقين ٩٠°","Banging the elbows on the floor|Flaring the elbows to 90°"]);
// Back
X("pullup","bk","u",1,5,10,150,["عقلة (Pull-up)","Pull-up"],["الظهر العريض، الباي","Lats, biceps"],
 ["تعلّق بقبضة أعرض قليلًا من الكتفين|اسحب صدرك نحو البار وأنت تُنزل المرفقين|انزل حتى يستقيم الذراعان. سجّل الوزن الإضافي فقط (0 إن لم يوجد)","Hang with a grip slightly wider than your shoulders|Pull your chest toward the bar, driving your elbows down|Lower to straight arms. Log added weight only (0 if none)"],
 ["التأرجح والركل|أنصاف التكرارات","Kipping and swinging|Half reps"]);
X("latpd","bk","u",0,8,12,120,["سحب عالي (Lat Pulldown)","Lat Pulldown"],["الظهر العريض، الباي","Lats, biceps"],
 ["ثبّت فخذيك تحت الوسادة|اسحب البار إلى أعلى الصدر مع إنزال المرفقين|ارجع ببطء حتى يمتد الذراعان","Lock your thighs under the pad|Pull the bar to your upper chest, driving the elbows down|Return slowly to a full stretch"],
 ["الميل للخلف كثيرًا|سحب البار خلف الرقبة","Leaning way back|Pulling behind the neck"]);
X("latpdn","bk","u",0,8,12,120,["سحب عالي قبضة ضيقة","Close-Grip Lat Pulldown"],["الظهر العريض، منتصف الظهر، الباي","Lats, mid back, biceps"],
 ["استخدم مقبض V أو قبضة ضيقة|اسحب نحو أسفل الصدر|ارجع ببطء مع تمدد كامل","Use a V-handle or a close grip|Pull toward your lower chest|Return slowly to a full stretch"],
 ["الميل للخلف كثيرًا|ترك الوزن يرتفع بسرعة","Leaning way back|Letting the weight fly up"]);
X("bbrow","bk","u",1,6,10,150,["تجديف بالبار منحني","Barbell Bent-Over Row"],["منتصف الظهر، العريض، الكتف الخلفي","Mid back, lats, rear delts"],
 ["انحنِ من الورك بظهر مستقيم والجذع شبه موازٍ للأرض|اسحب البار نحو أسفل البطن|أنزله بتحكم","Hinge at the hips with a flat back, torso close to parallel|Row the bar to your lower stomach|Lower under control"],
 ["تقويس الظهر|رفع الجذع مع كل تكرار للغش","Rounding the back|Standing up on each rep to cheat"]);
X("dbrow","bk","u",1,8,12,90,["تجديف بالدمبل يد واحدة","One-Arm Dumbbell Row"],["الظهر العريض، منتصف الظهر","Lats, mid back"],

const DEF=()=>({v:2,lang:"ar",onboarded:false,prefs:{goal:"muscle",level:"beginner",days:4,equip:"gym"},
  profile:{sex:"male",age:"",height:"",weight:"",activity:1.375,surplus:300,protPerKg:2,kcalOverride:"",protOverride:""},

function merge(d,o){for(const k in o){if(o[k]&&typeof o[k]==="object"&&!Array.isArray(o[k])&&d[k]&&typeof d[k]==="object"&&!Array.isArray(d[k]))d[k]=merge(d[k],o[k]);else d[k]=o[k]}return d}

function buildProgram(key,goal){
  const P=PROGRAMS[key];
  const days=P.days.map(d=>({id:d.id,name:clone(d.name),wd:d.wd,focus:d.focus?clone(d.focus):"",items:d.items.map(([ex,s,lo,hi,rest])=>{
    const b=LIB[ex];const it={ex,s,lo:lo??b.lo,hi:hi??b.hi,rest:rest??b.rest};
    if(goal==="strength"&&b.c&&!BW.has(ex)){it.lo=4;it.hi=6;it.rest=Math.max(it.rest,180)}
    if(goal==="fit"){it.lo=Math.max(it.lo,10);it.hi=Math.max(it.hi,15);it.rest=Math.min(it.rest,90)}
    return it})}));
  return{key,name:clone(P.name),days};
}
// v1 stored each program exercise with its own id/name; v2 keys everything by library id.
function migrate(o){
  if(o.v===2)return merge(DEF(),o);
  const n=merge(DEF(),{profile:o.profile||{},settings:o.settings||{},sessions:o.sessions||[],bodyw:o.bodyw||[],meas:o.meas||[],food:o.food||[]});
  const map=id=>id==="legpress2"?"legpress":id;
  const addCustom=e=>{if(e&&!LIB[map(e.id)]&&!n.custom[e.id])n.custom[e.id]={name:e.ar||e.en||"?",k:e.k==="l"?"l":"u"}};
  (o.retired||[]).forEach(addCustom);
  if(Array.isArray(o.program)&&o.program.length){
    n.program={key:"custom",name:"",days:o.program.map(d=>({id:d.id,name:PROGRAMS.ul4.days.some(x=>x.id===d.id&&x.name.ar===d.ar)?clone(PROGRAMS.ul4.days.find(x=>x.id===d.id).name):d.ar,wd:d.wd,focus:d.focus||"",
      items:d.ex.map(e=>{addCustom(e);return{ex:map(e.id),s:e.s,lo:e.lo,hi:e.hi,rest:e.rest}})}))};
  }else n.program=buildProgram("ul4","muscle");
  n.sessions.forEach(s=>s.ex.forEach(e=>{e.id=map(e.id);if(!LIB[e.id]&&!n.custom[e.id])n.custom[e.id]={name:"?",k:"u"}}));
  if(o.draft&&o.draft.ex){const ex={};for(const k in o.draft.ex)ex[map(k)]=o.draft.ex[k];n.draft={day:o.draft.day,date:o.draft.date,startedAt:o.draft.startedAt,ex,wu:{}}}
  n.onboarded=true;return n;
}

function knownEx(){const ids=new Set();DAYS.forEach(d=>d.items.forEach(i=>ids.add(i.ex)));S.sessions.forEach(s=>s.ex.forEach(e=>ids.add(e.id)));return[...ids]}

/* ---------- training logic ---------- */
const work=sets=>sets.filter(s=>!s.wu);
function history(id){const out=[];for(const s of S.sessions)for(const e of s.ex){if(e.id===id){const w=work(e.sets);if(w.length)out.push({date:s.date,sets:w,sid:s.id})}}return out.sort((a,b)=>a.date<b.date?-1:1)}
function bestOf(sets){let b=null;for(const st of sets){const v=e1rm(st.w,st.r);if(!b||v>b.e)b={e:v,w:st.w,r:st.r}}return b}
function prs(id){const h=history(id);let maxW=null,maxE=null;for(const x of h)for(const st of x.sets){if(!maxW||st.w>maxW.w||(st.w===maxW.w&&st.r>maxW.r))maxW={w:st.w,r:st.r,date:x.date};const v=e1rm(st.w,st.r);if(!maxE||v>maxE.e)maxE={e:v,w:st.w,r:st.r,date:x.date}}return{maxW,maxE}}
function suggest(it){
  const ex=exInfo(it.ex);const h=history(it.ex);const inc=ex.k==="l"?S.settings.incL:S.settings.incU;
  if(!h.length)return{kind:"new",w:null,text:t("sgNew",{hi:it.hi})};
  const last=h[h.length-1].sets;const topW=Math.max(...last.map(s=>s.w));const atTop=last.filter(s=>s.w===topW);
  const maxR=Math.max(0,...last.map(s=>s.rpe||0));const hard=maxR>=10?t("sgHard",{r:maxR}):"";
  if(last.length>=it.s&&atTop.length>=it.s&&atTop.every(s=>s.r>=it.hi)){
    if(BW.has(it.ex)&&topW===0)return{kind:"up",w:0,text:t("sgUpBw",{hi:it.hi})};
    return{kind:"up",w:r1(topW+inc),text:t("sgUp",{hi:it.hi,w:r1(topW+inc),lo:it.lo})}}
  const fails=atTop.filter(s=>s.r<it.lo).length;
  if(fails>=2&&h.length>=2){const prev=h[h.length-2].sets;const pTop=Math.max(...prev.map(s=>s.w));
    if(pTop===topW&&prev.filter(s=>s.w===pTop&&s.r<it.lo).length>=2){const dw=r25(topW*0.9);return{kind:"down",w:dw,text:t("sgDown",{lo:it.lo,w:dw})}}}
  return{kind:"hold",w:topW,text:t("sgHold",{w:topW,hi:it.hi})+hard};
}
// Ramp of lighter sets before a compound lift.
function warmPlan(w){if(!w||w<20)return null;const p=[[0.5,8],[0.7,4]];if(w>=60)p.push([0.85,2]);return p.map(([f,r])=>({w:r25(w*f),r})).filter(x=>x.w>0&&x.w<w)}
function nextDayId(){
  if(!DAYS.length)return{id:null,why:"rest"};
  const sched=DAYS.find(d=>d.wd===new Date().getDay());if(sched)return{id:sched.id,why:"sched"};
  const last=[...S.sessions].sort((a,b)=>a.date<b.date?1:-1)[0];
  if(!last)return{id:DAYS[0].id,why:"rest"};
  const i=DAYS.findIndex(d=>d.id===last.day);return{id:DAYS[(i+1)%DAYS.length].id,why:"rest"};
}

function targets(){

  if(w&&h&&a){const bmr=10*w+6.25*h-5*a+(p.sex==="female"?-161:5);tdee=bmr*Number(p.activity||1.375);kcal=Math.round((tdee+Number(p.surplus||0))/10)*10}

  return{kcal,prot,tdee};
}

/* ---------- chart ---------- */
function lineChart(pts,unit){
  if(pts.length<2)return`<div class="empty">${t("chartNeeds")}</div>`;
  const W=600,H=220,Lp=52,R=14,T=16,B=30;
  const xs=pts.map(p=>parseD(p.x).getTime()),ys=pts.map(p=>p.y);
  let x0=Math.min(...xs),x1=Math.max(...xs);if(x0===x1){x0-=864e5;x1+=864e5}
  let y0=Math.min(...ys),y1=Math.max(...ys);const pY=(y1-y0)*0.15||Math.max(1,y1*0.05);y0-=pY;y1+=pY;
  const X=v=>Lp+(v-x0)/(x1-x0)*(W-Lp-R); // time runs left→right so "up and to the right" reads as progress
  const Y=v=>T+(1-(v-y0)/(y1-y0))*(H-T-B);
  const ticks=[0,1,2,3].map(i=>y0+(y1-y0)*i/3);
  const line=pts.map((p,i)=>(i?"L":"M")+X(xs[i]).toFixed(1)+" "+Y(p.y).toFixed(1)).join(" ");
  const area=line+` L${X(xs[xs.length-1]).toFixed(1)} ${H-B} L${X(xs[0]).toFixed(1)} ${H-B} Z`;const li=pts.length-1;
  return`<svg viewBox="0 0 ${W} ${H}" style="direction:ltr" role="img" aria-label="chart">
   ${ticks.map(v=>`<line x1="${Lp}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${Lp-6}" y="${Y(v)+4}" text-anchor="end" font-size="12" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${fmtN(v)}</text>`).join("")}
   <path d="${area}" fill="var(--accent)" fill-opacity=".10"/>
   <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
   ${pts.map((p,i)=>`<circle cx="${X(xs[i])}" cy="${Y(p.y)}" r="${i===li?5.5:3}" fill="${i===li?"var(--accent)":"var(--surface)"}" stroke="var(--accent)" stroke-width="2"/>`).join("")}
   <text x="${X(xs[0])}" y="${H-8}" text-anchor="start" font-size="12" fill="var(--muted)">${shortD(pts[0].x)}</text>
   <text x="${X(xs[li])}" y="${H-8}" text-anchor="end" font-size="12" fill="var(--fg)" font-weight="700">${r1(pts[li].y)} ${unit} · ${shortD(pts[li].x)}</text></svg>`;
}

  return`<div class="info"><b>${t("muscles")}</b>${esc(L(ex.mu))}<b>${t("steps")}</b><ol>${L(ex.st).split("|").map(s=>`<li>${esc(s)}</li>`).join("")}</ol><b>${t("mistakes")}</b><ul>${L(ex.mi).split("|").map(s=>`<li>${esc(s)}</li>`).join("")}</ul></div>`;

const rpeOpts=v=>`<option value=""></option>${[6,7,8,9,10].map(n=>`<option value="${n}" ${Number(v)===n?"selected":""}>${n}</option>`).join("")}`;

  if(!DAYS.length)return`<h2>${t("emptyProg")}</h2><div class="empty stack">${t("emptyProgTxt")}<button type="button" id="goEdit">${t("addDays")}</button></div>`;
  if(S.draft&&!DAYS.some(d=>d.id===S.draft.day)){S.draft=null;save()}
  if(selDay&&!DAYS.some(d=>d.id===selDay))selDay=null;
  const nd=nextDayId();const day=DAYS.find(d=>d.id===(S.draft?S.draft.day:(selDay||nd.id)));
  const ndName=dayName(DAYS.find(d=>d.id===nd.id));const wdT=WD[LANG][new Date().getDay()];
  const lead=S.draft?t("running",{x:new Date(S.draft.startedAt).toLocaleTimeString(LANG,{hour:"numeric",minute:"2-digit"})}):nd.why==="sched"?t("todaySched",{d:wdT,x:esc(ndName)}):t("todayRest",{d:wdT,x:esc(ndName)});

  <p class="muted small" style="margin:0 0 10px">${lead}${day.focus?"<br>"+esc(L(day.focus)):""}</p>`;
  if(!S.draft)h+=`<div class="chips">${DAYS.map(d=>`<button type="button" class="chip ${d.id===day.id?"on":""}" data-day="${d.id}">${esc(dayName(d))} · ${wdLabel(d)}${d.id===nd.id?`<span class="dot" title="${t("suggested")}"></span>`:""}</button>`).join("")}</div>`;
  h+=`<div class="row" style="margin-top:8px"><button type="button" id="goEdit">${t("editProg")}</button></div>
  <details class="card" style="margin-top:12px"><summary>${t("how")}</summary><div class="small stack" style="gap:6px">
   <div><b>${t("howSched")}</b> ${DAYS.map(d=>wdLabel(d)+" "+esc(dayName(d))).join(" · ")}. ${t("howSchedTail")}</div>
   <div><b>${t("howProg")}</b> ${t("howProgT",{u:S.settings.incU,l:S.settings.incL})}</div>
   <div><b>${t("howEff")}</b> ${t("howEffT")}</div><div><b>${t("howWu")}</b> ${t("howWuT")}</div>
   <div class="muted">${t("disclaimer")}</div></div></details><div class="stack" style="margin-top:12px">`;
  day.items.forEach((it,ei)=>{

    const rows=dr?(dr.ex[id]||[]):[],wus=dr?(dr.wu&&dr.wu[id]||[]):[];const n=Math.max(it.s,rows.length);
    const plan=ex.c?warmPlan(sg.w):null;

      <input id="${pre}w-${id}-${i}" class="${isWu?"wuin":""} ${r.done?"set-done":""}" type="number" inputmode="decimal" step="0.5" min="0" data-ex="${id}" data-i="${i}" data-f="w" data-wu="${isWu?1:""}" value="${r.w!==undefined?(r.w??""):(isWu||sg.w==null?"":sg.w)}" placeholder="${isWu?"":(last&&last.sets[i]?last.sets[i].w:t("kg"))}" aria-label="${t("hWeight")} ${i+1}">
      <input id="${pre}r-${id}-${i}" class="${isWu?"wuin":""} ${r.done?"set-done":""}" type="number" inputmode="numeric" step="1" min="0" data-ex="${id}" data-i="${i}" data-f="r" data-wu="${isWu?1:""}" value="${r.r??""}" placeholder="${isWu?"":(last&&last.sets[i]?last.sets[i].r:it.lo+"–"+it.hi)}" aria-label="${t("hReps")} ${i+1}">
      ${rpe?(isWu?"<span></span>":`<select id="${pre}p-${id}-${i}" data-ex="${id}" data-i="${i}" data-f="rpe" data-wu="" aria-label="RPE ${i+1}">${rpeOpts(r.rpe)}</select>`):""}

      <div class="hint ${sg.kind==="up"?"up":""}">${sg.kind==="up"?`<span class="tag up">${t("tagUp")}</span> `:sg.kind==="down"?`<span class="tag">${t("tagDown")}</span> `:""}${esc(sg.text)}</div>

   ${S.draft?`<button type="button" class="ghost block" id="discard">${t("discard")}</button>`:""}<p class="muted small" style="margin:0">${t("draftNote")}</p></div>`;
  return h;
};
const curDay=()=>S.draft?S.draft.day:(selDay||nextDayId().id);
function ensureDraft(){if(!S.draft)S.draft={day:curDay(),date:today(),startedAt:Date.now(),ex:{},wu:{}};S.draft.wu=S.draft.wu||{};return S.draft}
const rowsOf=(d,id,wu)=>{const bag=wu?d.wu:d.ex;return bag[id]=bag[id]||[]};
BIND.today=function(){
  $("#goEdit").onclick=()=>{editDay=DAYS.length?curDay():null;go("edit")};
  if(!DAYS.length)return;
  $$("[data-day]").forEach(b=>b.onclick=()=>{selDay=b.dataset.day;render()});
  $$("[data-info]").forEach(b=>b.onclick=()=>{const id=b.dataset.info;openInfo.has(id)?openInfo.delete(id):openInfo.add(id);keepScroll(render)});
  $$("[data-f]").forEach(inp=>inp.addEventListener(inp.tagName==="SELECT"?"change":"input",()=>{
    const d=ensureDraft();const a=rowsOf(d,inp.dataset.ex,!!inp.dataset.wu);const i=+inp.dataset.i;a[i]=a[i]||{};
    a[i][inp.dataset.f]=inp.value===""?null:num(inp.value);save()}));
  $$("[data-tick]").forEach(b=>b.onclick=()=>{
    const id=b.dataset.tick,i=+b.dataset.i,wu=!!b.dataset.wu,pre=wu?"w":"";const d=ensureDraft();const a=rowsOf(d,id,wu);a[i]=a[i]||{};
    const wv=num($(`#${pre}w-${id}-${i}`).value),rv=num($(`#${pre}r-${id}-${i}`).value);
    if(!a[i].done&&(wv==null||rv==null)){toast(t("needWR"));return}
    a[i].w=wv;a[i].r=rv;a[i].done=!a[i].done;save();
    if(a[i].done&&!wu){const it=DAYS.find(x=>x.id===d.day).items.find(x=>x.ex===id);startTimer(it?it.rest:90,exName(id))}
    keepScroll(render)});
  $$("[data-addset]").forEach(b=>b.onclick=()=>{const id=b.dataset.addset;const d=ensureDraft();const a=rowsOf(d,id,false);
    const it=DAYS.find(x=>x.id===d.day).items.find(x=>x.ex===id);while(a.length<(it?it.s:0))a.push({});a.push({});save();keepScroll(render)});
  $$("[data-addwu]").forEach(b=>b.onclick=()=>{const id=b.dataset.addwu;const d=ensureDraft();const a=rowsOf(d,id,true);
    const it=DAYS.find(x=>x.id===d.day).items.find(x=>x.ex===id);const plan=exInfo(id).c&&it?warmPlan(suggest(it).w):null;const p=plan&&plan[a.length];
    a.push(p?{w:p.w,r:p.r}:{});save();keepScroll(render)});
  $("#finish").onclick=finishWorkout;
  const ds=$("#discard");if(ds)ds.onclick=()=>{if(!armed(ds))return;S.draft=null;save();stopTimer();render();toast(t("discarded"))};
};
function finishWorkout(){
  const day=DAYS.find(d=>d.id===curDay());const ex=[];const newPR=[];
  for(const it of day.items){const id=it.ex;const sets=[];
    const nWu=$$(`input[data-ex="${id}"][data-f="w"][data-wu="1"]`).length;
    for(let i=0;i<nWu;i++){const w=num($(`#ww-${id}-${i}`).value),r=num($(`#wr-${id}-${i}`).value);if(w!=null&&r)sets.push({w,r,wu:true})}
    const n=$$(`input[data-ex="${id}"][data-f="w"][data-wu=""]`).length;
    for(let i=0;i<n;i++){const w=num($(`#w-${id}-${i}`).value),r=num($(`#r-${id}-${i}`).value);const pe=$(`#p-${id}-${i}`);const rp=pe?num(pe.value):null;
      if(w!=null&&r)sets.push(rp?{w,r,rpe:rp}:{w,r})}
    const ws=work(sets);
    if(ws.length){const before=prs(id);const b=bestOf(ws);const topW=Math.max(...ws.map(s=>s.w));
      if(before.maxE&&(b.e>before.maxE.e+1e-9||topW>before.maxW.w))newPR.push(exName(id));ex.push({id,sets})}}
  if(!ex.length){toast(t("noSets"));return}
  const dur=S.draft?Math.round((Date.now()-S.draft.startedAt)/60000):null;
  S.sessions.push({id:uid(),date:S.draft?S.draft.date:today(),day:day.id,dayName:dayName(day),ex,min:dur});
  S.draft=null;selDay=null;save();stopTimer();progEx=ex[0].id;go("progress");
  toast(newPR.length?t("newPR",{x:newPR.join(LANG==="ar"?"، ":", ")}):t("workoutSaved"));
}

/* ---------- progress ---------- */
const volOf=sets=>work(sets).reduce((u,x)=>u+x.w*x.r,0);
function exOptions(sel,ids,includeLogged){
  const inProg=new Set();DAYS.forEach(d=>d.items.forEach(i=>inProg.add(i.ex)));
  const opt=id=>`<option value="${esc(id)}" ${id===sel?"selected":""}>${esc(exName(id))}</option>`;
  let h=DAYS.map(d=>`<optgroup label="${esc(dayName(d))}">${[...new Set(d.items.map(i=>i.ex))].filter(id=>ids.has(id)).map(opt).join("")}</optgroup>`).join("");
  const rest=[...ids].filter(id=>!inProg.has(id));if(includeLogged&&rest.length)h+=`<optgroup label="${t("removedEx")}">${rest.map(opt).join("")}</optgroup>`;
  return h;
}
VIEWS.progress=function(){
  const now=new Date();const sow=new Date(now);sow.setDate(now.getDate()-((now.getDay()+1)%7));sow.setHours(0,0,0,0); // week starts Saturday
  const wk=S.sessions.filter(s=>parseD(s.date)>=sow).length;const sorted=[...S.sessions].sort((a,b)=>a.date<b.date?1:-1);
  const vol=s=>s.ex.reduce((t2,e)=>t2+volOf(e.sets),0);
  let h=`<h2>${t("progress")}</h2><div class="grid3">
   <div class="card stat"><b class="num">${wk} / ${DAYS.length}</b><span class="l">${t("thisWeek")}</span></div>
   <div class="card stat"><b class="num">${S.sessions.length}</b><span class="l">${t("total")}</span></div>
   <div class="card stat"><b class="num">${sorted[0]?fmtN(vol(sorted[0])):"—"}</b><span class="l">${t("lastVol")}</span></div></div>`;
  const ids=new Set(knownEx());
  if(!progEx||!ids.has(progEx))progEx=[...ids][0]||null;
  const hx=progEx?history(progEx):[];
  const M={top:["mTop",x=>Math.max(...x.sets.map(s=>s.w)),"mTopD"],vol:["mVol",x=>volOf(x.sets),"mVolD"],e1rm:["mE1",x=>bestOf(x.sets).e,"mE1D"]};
  const m=M[progMetric]||M.top;const pts=hx.map(x=>({x:x.date,y:r1(m[1](x))}));const p=progEx?prs(progEx):{};
  h+=`<h2>${t("exChart")}</h2><div class="card stack"><label class="f">${t("pickEx")}<select id="progEx">${exOptions(progEx,ids,true)}</select></label>
   <div class="chips">${Object.entries(M).map(([k,v])=>`<button type="button" class="chip ${k===progMetric?"on":""}" data-metric="${k}">${t(v[0])}</button>`).join("")}</div>
   <div class="small muted">${t(m[2])}</div><div class="chart">${lineChart(pts,t("kg"))}</div>
   ${p.maxW?`<div class="row small"><span class="tag pr">${t("heaviest")}</span><span class="num">${p.maxW.w} ${t("kg")} × ${p.maxW.r}</span><span class="muted">${shortD(p.maxW.date)}</span>
     <span class="tag pr">${t("bestEst")}</span><span class="num">${r1(p.maxE.e)} ${t("kg")}</span></div>`:""}</div>`;
  const maxSets=Math.max(0,...hx.map(x=>x.sets.length));
  h+=`<h2>${t("allSets")}</h2>`+(hx.length?`<div class="card tbl-wrap"><table><thead><tr><th>${t("date")}</th>${Array.from({length:maxSets},(_,i)=>`<th>${t("setN",{n:i+1})}</th>`).join("")}<th>${t("volume")}</th></tr></thead><tbody>
   ${[...hx].reverse().map((x,ri,arr)=>{const pv=arr[ri+1];const top=Math.max(...x.sets.map(s=>s.w));const ptop=pv?Math.max(...pv.sets.map(s=>s.w)):null;
     return`<tr><td><button type="button" class="link small" data-editsess="${x.sid}">${shortD(x.date)} ✎</button>${ptop!=null&&top>ptop?'<span class="tag up">↑</span>':""}</td>${Array.from({length:maxSets},(_,i)=>{const st=x.sets[i];return`<td class="num">${st?st.w+"×"+st.r+(st.rpe?" @"+st.rpe:""):'<span class="muted">—</span>'}</td>`}).join("")}<td class="num">${fmtN(volOf(x.sets))}</td></tr>`}).join("")}
   </tbody></table></div><p class="small muted" style="margin:6px 0 0">${t("allSetsNote")}</p>`:`<div class="empty">${t("notLogged")}</div>`);
  const rowsPR=[...ids].map(id=>({id,p:prs(id)})).filter(x=>x.p.maxW);
  h+=`<h2>${t("records")}</h2>`+(rowsPR.length?`<div class="card tbl-wrap"><table><thead><tr><th>${t("exercise")}</th><th>${t("bestSet")}</th><th>${t("mE1")}</th><th>${t("date")}</th></tr></thead><tbody>
   ${rowsPR.map(x=>`<tr><td>${esc(exName(x.id))}</td><td class="num">${x.p.maxW.w}×${x.p.maxW.r}</td><td class="num">${r1(x.p.maxE.e)}</td><td class="num">${shortD(x.p.maxE.date)}</td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">${t("noRecords")}</div>`);
  h+=`<h2>${t("history")}</h2>`+(sorted.length?`<div class="card"><ul class="clean list">${sorted.map(s=>{const d=DAYS.find(x=>x.id===s.day);const n=s.ex.reduce((a,e)=>a+work(e.sets).length,0);
     return`<li><div style="min-width:0"><b>${esc(d?dayName(d):(s.dayName||t("deletedDay")))}</b> <span class="muted small">${fmtD(s.date)}</span><div class="small muted">${t("setsN",{n})} · ${t("volKg",{v:`<span class="num">${fmtN(vol(s))}</span>`})}${s.min?" · "+t("minN",{n:s.min}):""}</div></div>
     <div class="row" style="gap:2px;flex-wrap:nowrap"><button type="button" class="ghost small" data-editsess="${s.id}">${t("edit")}</button><button type="button" class="ghost small" data-delsess="${s.id}">${t("del")}</button></div></li>`}).join("")}</ul></div>`
    :`<div class="empty">${t("noHistory")}</div>`);
  return h;
};

  h+=`<h2>${t("last7")}</h2><div class="card tbl-wrap"><table><thead><tr><th>${t("day")}</th><th>${t("kcal")}</th><th>${t("protein")}</th><th></th></tr></thead><tbody>
   ${days.map(x=>`<tr><td>${fmtD(x.s)}</td><td class="num">${x.n?Math.round(x.k):"—"}</td><td class="num">${x.n?Math.round(x.p):"—"}</td><td>${x.n&&T.prot?(x.p>=T.prot?`<span class="tag up">${t("protOk")}</span>`:`<span class="tag">${t("protLow")}</span>`):""}</td></tr>`).join("")}</tbody></table></div>`;
  if(T.tdee)h+=`<p class="small muted">${t("tdeeNote",{t:fmtN(T.tdee),s:S.profile.surplus})}</p>`;
  return h;
};
BIND.food=function(){
  $("#fDate").onchange=e=>{foodDate=e.target.value||null;render()};
  $("#fAdd").onclick=()=>{const name=$("#fName").value.trim(),kcal=num($("#fKcal").value),protein=num($("#fProt").value);
    if(!name&&kcal==null&&protein==null){toast(t("enterMeal"));return}S.food.push({id:uid(),date:foodDate||today(),name,kcal:kcal||0,protein:protein||0});save();render();toast(t("added"))};
  const rec=recentFoods();
  $$("[data-quick]").forEach(b=>b.onclick=()=>{const f=rec[+b.dataset.quick];S.food.push({id:uid(),date:foodDate||today(),name:f.name,kcal:f.kcal,protein:f.protein});save();keepScroll(render);toast(t("added"))});
  $$("[data-delf]").forEach(b=>b.onclick=()=>{S.food=S.food.filter(f=>f.id!==b.dataset.delf);save();keepScroll(render)});
};

/* ---------- settings ---------- */
let installEvt=null;
const isStandalone=()=>{try{return matchMedia("(display-mode: standalone)").matches||navigator.standalone===true}catch(e){return false}};
const pwaCapable=()=>!!document.querySelector('link[rel="manifest"]');
VIEWS.settings=function(){
  const p=S.profile,T=targets();
  return`<h2>${t("myProg")}</h2><div class="card stack"><div><b>${esc(progName())}</b> <span class="muted small">· ${t("perWeek",{n:DAYS.length})}</span></div>
   <div class="grid2"><button type="button" id="goProgs">${t("changeProg")}</button><button type="button" id="goEdit">${t("editDaysEx")}</button></div>
   <button type="button" class="ghost" id="redoQ">${t("redoQ")}</button></div>
  <h2>${t("prefs")}</h2><div class="card stack">
   <div class="q"><span>${t("qLang")}</span><div class="chips"><button type="button" class="chip ${LANG==="ar"?"on":""}" data-lang="ar">العربية</button><button type="button" class="chip ${LANG==="en"?"on":""}" data-lang="en">English</button></div></div>
   <label class="row" style="flex-wrap:nowrap;cursor:pointer"><input id="sRpe" type="checkbox" style="width:22px;min-height:22px" ${S.settings.rpe?"checked":""}><span>${t("showRpe")}</span></label>
   <div class="grid2"><label class="f">${t("incUpper")}<input id="sIncU" type="number" inputmode="decimal" step="0.5" value="${S.settings.incU}"></label>
   <label class="f">${t("incLower")}<input id="sIncL" type="number" inputmode="decimal" step="0.5" value="${S.settings.incL}"></label></div>
   <button type="button" id="sSave">${t("save")}</button></div>
  ${pwaCapable()?`<h2>${t("install")}</h2><div class="card stack small">${isStandalone()?`<div>${t("installed")}</div>`:`
   <button type="button" class="primary" id="instBtn" ${installEvt?"":"hidden"}>${t("installBtn")}</button><div class="muted">${t("installIos")}</div><div class="muted">${t("installAndroid")}</div>`}</div>`:""}
  <h2>${t("me")}</h2><div class="card stack"><div class="grid2">
    <label class="f">${t("sex")}<select id="pSex"><option value="male" ${p.sex==="male"?"selected":""}>${t("male")}</option><option value="female" ${p.sex==="female"?"selected":""}>${t("female")}</option></select></label>
    <label class="f">${t("age")}<input id="pAge" type="number" inputmode="numeric" value="${esc(p.age)}"></label>
    <label class="f">${t("height")}<input id="pH" type="number" inputmode="decimal" value="${esc(p.height)}"></label>
    <label class="f">${t("weightKg")}<input id="pW" type="number" inputmode="decimal" step="0.1" value="${esc(p.weight)}"></label></div>
   <label class="f">${t("activity")}<select id="pAct">${[[1.2,"act1"],[1.375,"act2"],[1.55,"act3"],[1.725,"act4"]].map(([v,l])=>`<option value="${v}" ${Number(p.activity)===v?"selected":""}>${t(l)}</option>`).join("")}</select></label>
   <div class="grid2"><label class="f">${t("surplus")}<input id="pSur" type="number" inputmode="numeric" step="50" value="${esc(p.surplus)}"></label>
    <label class="f">${t("protKg")}<input id="pPk" type="number" inputmode="decimal" step="0.1" value="${esc(p.protPerKg)}"></label>
    <label class="f">${t("kcalMan")}<input id="pKo" type="number" inputmode="numeric" value="${esc(p.kcalOverride)}"></label>
    <label class="f">${t("protMan")}<input id="pPo" type="number" inputmode="numeric" value="${esc(p.protOverride)}"></label></div>
   <button type="button" class="primary" id="pSave">${t("save")}</button>
   ${T.kcal?`<div class="hint">${t("curTarget",{k:`<span class="num">${T.kcal}</span>`,p:`<span class="num">${T.prot}</span>`})}</div>`:""}<div class="small muted">${t("targetTip")}</div></div>
  <h2>${t("backup")}</h2><div class="card stack"><div class="small muted">${t("backupTip")}</div>
   <div class="row"><button type="button" class="primary" id="bCopy">${t("copyBackup")}</button><button type="button" id="bDl">${t("dlFile")}</button></div>
   <textarea id="bText" readonly aria-label="${t("backupText")}"></textarea>
   <h3 style="margin-top:6px">${t("restore")}</h3><label class="f">${t("pasteHere")}<textarea id="bIn"></textarea></label>
   <label class="f">${t("orFile")}<input id="bFile" type="file" accept=".json,application/json,text/plain"></label><button type="button" id="bImp">${t("restoreBtn")}</button></div>
  <h2>${t("danger")}</h2><div class="card"><button type="button" class="danger block" id="bReset">${t("wipe")}</button></div>
  <p class="small muted" style="margin-top:16px">${t("counts",{a:S.sessions.length,b:S.bodyw.length,c:S.meas.length,d:S.food.length})}</p>`;
};
BIND.settings=function(){
  const dump=()=>JSON.stringify(Object.assign({app:"ironlog",exported:new Date().toISOString()},S));$("#bText").value=dump();
  $("#goProgs").onclick=()=>go("programs");$("#goEdit").onclick=()=>{editDay=null;go("edit")};$("#redoQ").onclick=()=>{OB=clone(S.prefs);go("welcome")};
  $$("[data-lang]").forEach(b=>b.onclick=()=>{LANG=S.lang=b.dataset.lang;save();applyLang();keepScroll(render)});
  $("#sRpe").onchange=e=>{S.settings.rpe=e.target.checked;save();toast(t("saved"))};
  $("#sSave").onclick=()=>{S.settings.incU=num($("#sIncU").value)??2.5;S.settings.incL=num($("#sIncL").value)??5;save();toast(t("saved"))};
  const ib=$("#instBtn");if(ib)ib.onclick=async()=>{if(!installEvt)return;installEvt.prompt();try{await installEvt.userChoice}catch(e){}installEvt=null;keepScroll(render)};
  $("#pSave").onclick=()=>{Object.assign(S.profile,{sex:$("#pSex").value,age:$("#pAge").value,height:$("#pH").value,weight:$("#pW").value,activity:Number($("#pAct").value),surplus:num($("#pSur").value)??300,protPerKg:num($("#pPk").value)??2,kcalOverride:$("#pKo").value,protOverride:$("#pPo").value});
    const w=num(S.profile.weight);if(w&&!S.bodyw.some(x=>x.date===today()))S.bodyw.push({date:today(),kg:w});save();keepScroll(render);toast(t("saved"))};
  $("#bCopy").onclick=()=>{const ta=$("#bText");const sel=()=>{ta.focus();ta.select();toast(t("selectCopy"))};try{navigator.clipboard.writeText(ta.value).then(()=>toast(t("copied")),sel)}catch(e){sel()}};
  $("#bDl").onclick=()=>{try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([dump()],{type:"application/json"}));a.download="ironlog-"+today()+".json";document.body.appendChild(a);a.click();a.remove();toast(t("dlMaybe"))}catch(e){toast(t("dlNo"))}};
  $("#bFile").onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{$("#bIn").value=rd.result;toast(t("fileLoaded"))};rd.readAsText(f)};
  $("#bImp").onclick=()=>{const b=$("#bImp");let o;try{o=JSON.parse($("#bIn").value)}catch(e){toast(t("badBackup"));return}
    if(!o||o.app!=="ironlog"||!Array.isArray(o.sessions)){toast(t("notOurs"));return}if(!armed(b,t("restoreC")))return;
    delete o.app;delete o.exported;S=migrate(o);LANG=S.lang||"ar";loadProgram();save();applyLang();render();toast(t("restored"))};
  $("#bReset").onclick=()=>{const b=$("#bReset");if(!armed(b,t("wipeC")))return;const lang=S.lang;S=DEF();S.lang=lang;loadProgram();save();OB=null;render();toast(t("wiped"))};
};

/* ---------- rest timer ---------- */
let tEnd=0,tInt=null,actx=null;
function beep(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();[0,0.25,0.5].forEach(o=>{const os=actx.createOscillator(),g=actx.createGain();os.frequency.value=880;g.gain.setValueAtTime(0.2,actx.currentTime+o);g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+o+0.2);os.connect(g);g.connect(actx.destination);os.start(actx.currentTime+o);os.stop(actx.currentTime+o+0.2)})}catch(e){}try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
function startTimer(sec,label){tEnd=Date.now()+sec*1000;$("#tLabel").textContent=t("restAfter",{x:label});$("#timer").hidden=false;$("#timer").classList.remove("ding");
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume()}catch(e){}clearInterval(tInt);tInt=setInterval(tick,250);tick()}
function tick(){const left=Math.ceil((tEnd-Date.now())/1000);const tm=$("#timer");
  if(left<=0){$("#tClock").textContent="0:00";if(!tm.classList.contains("ding")){tm.classList.add("ding");$("#tLabel").textContent=t("nextSet");beep();setTimeout(()=>{if(tm.classList.contains("ding"))stopTimer()},6000)}return}
  $("#tClock").textContent=mmss(left)}
function stopTimer(){clearInterval(tInt);$("#timer").hidden=true;$("#timer").classList.remove("ding")}
$("#tPlus").onclick=()=>{tEnd=Math.max(tEnd,Date.now())+30000;$("#timer").classList.remove("ding");tick()};
$("#tStop").onclick=stopTimer;

/* ---------- boot ---------- */
LANG=S.lang==="en"?"en":"ar";loadProgram();applyLang();
if(!storeOK)$("#storeWarn").hidden=false;
// Installable app: only when the page is served with its manifest (the hosted copy, not the artifact).
if(pwaCapable()){
  window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installEvt=e;if(tab==="settings")keepScroll(render)});
  if("serviceWorker" in navigator&&window.isSecureContext)navigator.serviceWorker.register("sw.js").catch(()=>{});
}
const h0=location.hash.slice(1);if(S.onboarded&&VIEWS[h0]&&!["sess","edit"].includes(h0))tab=h0;
render();
})();
</script>
